[package]
name = "flake-edit"
description = "Edit your flake inputs with ease."
version = "0.4.0"
edition = "2024"
keywords = ["nix", "flake", "terminal", "cli"]
categories = ["command-line-utilities"]

authors = ["Alexander Kenji Berthold"]

readme = "README.md"
license = "MIT"
repository = "https://github.com/a-kenji/flake-edit"
documentation = "https://github.com/a-kenji/flake-edit"
homepage = "https://github.com/a-kenji/flake-edit"
include = ["src/**/*", "docs/man/**/*", "LICENSE", "README.md", "build.rs"]

[[bin]]
name = "flake-edit"
required-features = ["application"]

[workspace]
members = ["."]
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["application"]
application = [
  "clap",
  "assets",
  "sizes",
  "diffy",
  "tracing-subscriber",
  "ratatui",
  "crossterm",
  "nucleo-matcher",
]
sizes = ["dep:base64", "dep:sha2"]
assets = ["clap_complete", "clap_complete_nushell", "clap_mangen", "manners"]

[dependencies]
base64 = { version = "0.23", optional = true }
clap = { version = "4.6.7", optional = true, features = ["derive"] }
clap_complete = { version = "4.6.11", features = [
  "unstable-dynamic",
], optional = true }
diffy = { version = "0.5.2", optional = true, features = ["std", "color"] }
directories = "6.0.0"
nix-uri = "0.2.0"
ureq = { version = "3", default-features = false, features = ["rustls"] }
rnix = "0.15.1"
rowan = "0.17.0"
ropey = { version = "1.6.1" }
semver = "1.0.28"
serde = { version = "1.0.229", default-features = false, features = [
  "derive",
  "alloc",
] }
serde_json = { version = "1.0.154" }
sha2 = { version = "0.11", optional = true }
smallvec = { version = "1.16", features = ["const_generics", "union"] }
toml = "1.1"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = [
  "time",
  "std",
  "fmt",
  "env-filter",
], optional = true }
ratatui = { version = "0.30.2", optional = true, default-features = false, features = [
  "crossterm",
] }
crossterm = { version = "0.29.0", optional = true, default-features = false }
nucleo-matcher = { version = "0.3", optional = true }


[build-dependencies]
clap = { version = "4.6.7", features = ["derive"], optional = true }
clap_complete = { version = "4.6.11", features = [
  "unstable-dynamic",
], optional = true }
clap_complete_nushell = { version = "4.6.2", optional = true }
clap_mangen = { version = "0.3.3", features = [], optional = true }
manners = { version = "0.1", optional = true }

[[bench]]
name = "benches"
path = "benches/benches.rs"
harness = false

[[bench]]
name = "divan"
path = "benches/divan.rs"
harness = false

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
incremental = true
lto = "thin"
# Set this to 1 or 2 to get more useful backtraces in debugger.
debug = false

[profile.dev.package.insta]
opt-level = 3

[profile.dev.package.similar]
opt-level = 3


[dev-dependencies]
criterion = "0.8.2"
divan = "0.1.21"
insta = { version = "1.49.0", features = ["yaml", "filters", "redactions"] }
insta-cmd = "0.7"
rstest = "0.28"
tempfile = "3"

[lints.rust]
unsafe_code = "deny"
unused_extern_crates = "warn"
unreachable_pub = "warn"

[lints.clippy]
allow_attributes = "warn"
dbg_macro = "warn"
exit = "deny"
todo = "warn"
unimplemented = "warn"
mem_forget = "warn"
rc_mutex = "warn"
unchecked_time_subtraction = "warn"
float_cmp = "warn"
filetype_is_file = "warn"
clone_on_ref_ptr = "warn"
if_then_some_else_none = "warn"
tabs_in_doc_comments = "warn"
assert_is_empty = "warn"
manual_assert_eq = "warn"
unnecessary_rest_pattern = "warn"
nonminimal_bool = "warn"
overly_complex_bool_expr = "warn"
with_capacity_zero = "warn"

[lints.rustdoc]
bare_urls = "warn"
unused_footnote_definition = "warn"
